# RAGE CIRCUIT – static game client + WebSocket proxy to the multiplayer server
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/rage-circuit/dist;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml model/gltf-binary;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # hashed build assets never change
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Blender-made textures and models keep fixed names: browsers must check for newer versions
    location /gfx/ {
        types {
            image/webp webp;
            model/gltf-binary glb;
        }
        add_header Cache-Control "no-cache";
        # a location's own add_header drops the server-level ones, so repeat them
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # index.html must always be fresh so new builds are picked up
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # multiplayer: browsers connect to ws://<host>/ws
    location /ws {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8787/health;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
